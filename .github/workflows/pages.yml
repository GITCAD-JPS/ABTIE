# Publie le site sur GitHub Pages à chaque poussée sur main.
#
# L'étape configure-pages est lancée avec « enablement », ce qui active
# GitHub Pages sur le dépôt si ce n'est pas déjà fait : aucun réglage à
# faire à la main dans les paramètres.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          # Le site est servi depuis la racine : index.html y est déjà.
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
