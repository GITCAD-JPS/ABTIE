# Publie le site sur GitHub Pages à chaque poussée sur main.
#
# Étape à faire une seule fois, à la main : Settings → Pages → Source →
# « GitHub Actions ». Créer un site Pages exige les droits d'administration
# du dépôt, que GitHub ne donne jamais au jeton automatique des workflows
# (« Resource not accessible by integration »). Une fois la source choisie,
# ce workflow prend le relais et republie tout seul.

name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          # Le site est servi depuis la racine : index.html y est déjà.
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
